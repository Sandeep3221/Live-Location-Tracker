<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <main class="login-page">
        <form class="login-form" action="/login" method="post">
            <h1 class="title">Login</h1>
            <div class="field">
                <label class="is-sr-only" for="username">Username</label>
                <input id="username" class="input" type="text" name="username" placeholder="Username" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label class="is-sr-only" for="password">Password</label>
                <input id="password" class="input" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
            </div>
            <button class="button is-fullwidth is-primary" type="submit">Login</button>
        </form>
    </main>
</body>
</html>
